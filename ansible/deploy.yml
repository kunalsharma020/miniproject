---
- name: Deploy configuration management API
  hosts: app
  become: true
  vars:
    app_dir: /opt/config-mgmt
    app_port: 3000
    nodejs_version: "20.x"
  tasks:
    - name: Install apt dependencies
      apt:
        name:
          - curl
          - git
        update_cache: true

    - name: Install Node.js (NodeSource)
      shell: |
        set -e
        curl -fsSL https://deb.nodesource.com/setup_{{ nodejs_version }} | bash -
        apt-get install -y nodejs
      args:
        creates: /usr/bin/node

    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy app source
      synchronize:
        src: "../"
        dest: "{{ app_dir }}/"
        rsync_opts:
          - "--exclude=node_modules"
          - "--exclude=.git"
          - "--exclude=deploy"

    - name: Install npm dependencies
      shell: npm ci --omit=dev
      args:
        chdir: "{{ app_dir }}"

    - name: Install systemd service
      copy:
        dest: /etc/systemd/system/config-mgmt.service
        mode: "0644"
        content: |
          [Unit]
          Description=Config Management API
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory={{ app_dir }}
          EnvironmentFile={{ app_dir }}/.env
          ExecStart=/usr/bin/node {{ app_dir }}/src/server.js
          Restart=always
          RestartSec=2

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      systemd:
        daemon_reload: true

    - name: Enable and start service
      systemd:
        name: config-mgmt
        enabled: true
        state: started

